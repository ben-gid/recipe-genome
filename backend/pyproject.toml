[project]
name = "recipe-genome-backend"
version = "0.1.0"
description = "Search API for recipe-genome — talks to Weaviate, never the offline pipeline"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.34.0",
    "weaviate-client>=4.22.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
