[project]
name = "recipe-genome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "weaviate-client>=4.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ty's project root is whatever folder VSCode is opened to, so a bare-folder open
# type-checks backend/ against the root .venv and can't find fastapi. Bolting the
# backend venv on as an extra search path is enough for the editor; open
# recipe-genome.code-workspace instead if you want them properly separated.
# Bump the version here if backend's .venv moves off 3.14.
[tool.ty.environment]
extra-paths = ["backend/.venv/lib/python3.14/site-packages"]
